<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111" />
<title>Tabata Timer</title>
<style>
  :root {
    --active: #22c55e;
    --rest: #ef4444;
    --idle: #3b82f6;
    --done: #a855f7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    transition: background-color 0.3s ease;
  }
  body.active   { background: var(--active); }
  body.rest     { background: var(--rest); }
  body.idle     { background: var(--idle); }
  body.done     { background: var(--done); }

  header {
    width: 100%;
    text-align: center;
    padding: 16px 0 8px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  #phase {
    font-size: 28px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    opacity: 0.95;
  }

  #countdown {
    font-size: 38vw;
    line-height: 1;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 24px rgba(0,0,0,0.25);
  }

  #round {
    font-size: 22px;
    font-weight: 600;
    opacity: 0.9;
  }

  footer {
    width: 100%;
    display: flex;
    gap: 12px;
    padding: 16px 0 24px;
  }
  button {
    flex: 1;
    padding: 18px 12px;
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #111;
    background: #fff;
    border: none;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.secondary {
    background: rgba(255,255,255,0.18);
    color: #fff;
  }
</style>
</head>
<body class="idle">
  <header><h1>Tabata Timer</h1></header>

  <main>
    <div id="phase">Ready</div>
    <div id="countdown">20</div>
    <div id="round">Round 0 / 8</div>
  </main>

  <footer>
    <button id="startBtn">Start</button>
    <button id="resetBtn" class="secondary">Reset</button>
  </footer>

<script>
(() => {
  const ROUNDS = 8;
  const WORK = 20;
  const REST = 10;

  const body = document.body;
  const phaseEl = document.getElementById('phase');
  const countEl = document.getElementById('countdown');
  const roundEl = document.getElementById('round');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');

  let state = 'idle';      // idle | work | rest | done
  let round = 0;
  let remaining = WORK;
  let intervalId = null;
  let running = false;

  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq = 880, duration = 0.25, type = 'sine', gain = 0.3) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.value = gain;
    osc.connect(g).connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    osc.start(t);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.stop(t + duration + 0.02);
  }
  function startBeep() { beep(1000, 0.3, 'square', 0.35); }
  function endBeep()   { beep(500,  0.4, 'sine',   0.35); }

  function render() {
    body.className = state;
    countEl.textContent = remaining;
    roundEl.textContent = `Round ${Math.min(round, ROUNDS)} / ${ROUNDS}`;
    if (state === 'work') phaseEl.textContent = 'Work';
    else if (state === 'rest') phaseEl.textContent = 'Rest';
    else if (state === 'done') phaseEl.textContent = 'Done!';
    else phaseEl.textContent = 'Ready';
  }

  function tick() {
    remaining--;
    if (remaining <= 0) {
      if (state === 'work') {
        endBeep();
        if (round >= ROUNDS) {
          state = 'done';
          stop();
          render();
          return;
        }
        state = 'rest';
        remaining = REST;
      } else if (state === 'rest') {
        round++;
        state = 'work';
        remaining = WORK;
        startBeep();
      }
    }
    render();
  }

  function start() {
    ensureAudio();
    if (state === 'done') reset();
    if (state === 'idle') {
      round = 1;
      state = 'work';
      remaining = WORK;
      startBeep();
      render();
    }
    if (intervalId) clearInterval(intervalId);
    intervalId = setInterval(tick, 1000);
    running = true;
    startBtn.textContent = 'Pause';
  }

  function pause() {
    if (intervalId) clearInterval(intervalId);
    intervalId = null;
    running = false;
    startBtn.textContent = 'Resume';
  }

  function stop() {
    if (intervalId) clearInterval(intervalId);
    intervalId = null;
    running = false;
    startBtn.textContent = 'Start';
  }

  function reset() {
    stop();
    state = 'idle';
    round = 0;
    remaining = WORK;
    render();
  }

  startBtn.addEventListener('click', () => {
    ensureAudio();
    if (running) pause();
    else start();
  });
  resetBtn.addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
